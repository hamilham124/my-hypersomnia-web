name: Build Hypersomnia Web

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang \
            lld \
            libc++-18-dev \
            libc++abi-18-dev \
            libunwind-18-dev \
            libssl-dev \
            pkg-config \
            python3 \
            python3-pip \
            git \
            wget \
            unzip

          test -f /usr/include/c++/v1/iostream
          echo "libc++ headers found"

      - name: Build Hypersomnia WebAssembly
        run: |
          chmod +x build-hypersomnia.sh
      
          ./build-hypersomnia.sh

      - name: Package itch.io build
        run: |
          cd dist
          zip -r ../hypersomnia-web.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypersomnia-web
          path: dist

      - name: Publish Web runtime branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: web
          publish_dir: ./dist
          force_orphan: true
