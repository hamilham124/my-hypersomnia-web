<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Flash Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #toolbar {
      min-height: 52px;
      background: #202020;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid #444;
    }

    button,
    label {
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 5px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover,
    label:hover {
      background: #444;
    }

    #fileInput {
      display: none;
    }

    #status {
      color: #bbb;
      font-size: 13px;
      margin-left: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #player-container {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
    }

    #message {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      pointer-events: none;
      text-align: center;
      padding: 30px;
    }
  </style>

  <!-- Ruffle -->
  <script src="./ruffle/ruffle.js"></script>
</head>

<body>

<div id="app">

  <div id="toolbar">

    <label for="fileInput">
      📁 Import SWF
    </label>

    <input
      id="fileInput"
      type="file"
      accept=".swf,application/x-shockwave-flash"
    >

    <button id="fullscreenButton">
      ⛶ Fullscreen
    </button>

    <button id="clearSaveButton">
      🗑 Clear Save
    </button>

    <span id="status">
      No game loaded
    </span>

  </div>

  <div id="player-container">

    <div id="message">
      Select an SWF file to begin.
    </div>

    <div id="player"></div>

  </div>

</div>

<script src="./player.js"></script>

</body>
</html>
